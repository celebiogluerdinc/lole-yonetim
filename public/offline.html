<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Çevrimdışı — Lole Yönetim</title>
<style>
  body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    background: #000; color: #F2F2F7; font-family: -apple-system, 'Segoe UI', Arial, sans-serif; }
  .card { background: #1C1C1E; border: 1px solid rgba(255,255,255,0.1); border-radius: 24px;
    padding: 40px 32px; text-align: center; max-width: 320px; margin: 24px; }
  .emoji { font-size: 42px; margin-bottom: 12px; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  p { font-size: 14px; color: #8E8E93; margin: 0 0 20px; line-height: 1.5; }
  button { width: 100%; border: 0; border-radius: 16px; padding: 12px; font-size: 15px; font-weight: 600;
    color: #fff; background: linear-gradient(180deg, #0a84ff, #0064d2); cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">📡</div>
    <h1>İnternet bağlantısı yok</h1>
    <p>Lole Yönetim'e ulaşılamıyor. Bağlantınızı kontrol edip tekrar deneyin.</p>
    <button onclick="location.reload()">Tekrar Dene</button>
  </div>
</body>
</html>
